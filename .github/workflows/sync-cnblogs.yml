name: Sync from CNBlogs

on:
  schedule: 
    - cron: '0 18 * * *'
  workflow_dispatch:
    inputs: 
      ref:
        description:  'Branch to sync/build'
        required: false
        default: 'main'  # ✅ 改成 main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth:  0
          persist-credentials:  true
          submodules: recursive
          ref: ${{ github. event.inputs.ref || 'main' }}  # ✅ 改成 main

      - name: Show workspace
        run:  |
          pwd
          ls -la

      - run: npm install -g hexo-cli
      - run: npm install
      - run: npm install hexo-migrator-rss --no-save

      - name:  Migrate from CNBlogs
        run: |
          set -eux
          hexo migrate rss https://www.cnblogs.com/xvsu/rss

      - name:  Commit and push
        env: 
          GIT_AUTHOR_NAME: "GitHub Actions"
          GIT_AUTHOR_EMAIL: "actions@github.com"
          GIT_COMMITTER_NAME: "GitHub Actions"
          GIT_COMMITTER_EMAIL:  "actions@github.com"
        run: |
          git add source/_posts  # ✅ 只添加文章
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Auto sync from CNBlogs"
            git push origin HEAD:main  # ✅ 推送到 main 分支
          fi