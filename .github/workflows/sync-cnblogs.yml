name: Sync from CNBlogs

on:  
  schedule:  
    - cron: '0 18 * * *'  # 每天凌晨 2 点（UTC 18: 00）
  workflow_dispatch: 
    inputs:  
      ref:
        description:   'Branch to sync/build'
        required: false
        default: 'main'

permissions:  
  contents: write

jobs: 
  sync: 
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth:  0
          persist-credentials: true
          submodules:   recursive
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Hexo
        run: npm install -g hexo-cli

      - name: Install dependencies
        run: npm install

      - name:   Install RSS migrator
        run: npm install hexo-migrator-rss --no-save

      - name: Clean old posts (avoid duplicates)
        run: |
          # 删除所有博客园同步的旧文章（通过文件名特征识别）
          # 修复：去掉空格，正确匹配 . md 文件
          find source/_posts -name "*-气温骤降*.md" -type f -delete || true
          echo "Old posts cleaned"

      - name: Migrate from CNBlogs
        run:   |
          set -eux
          hexo migrate rss https://www.cnblogs.com/xvsu/rss

      - name: Commit and push
        env:
          GIT_AUTHOR_NAME: "GitHub Actions"
          GIT_AUTHOR_EMAIL: "actions@github.com"
          GIT_COMMITTER_NAME: "GitHub Actions"
          GIT_COMMITTER_EMAIL: "actions@github. com"
        run: |
          # 先拉取远程最新代码，避免冲突
          git config pull.rebase false
          git pull origin main --no-edit || true
          
          # 添加文章
          git add source/_posts
          
          # 检查是否有变化
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Auto sync from CNBlogs"
            git push origin HEAD:main
          fi
