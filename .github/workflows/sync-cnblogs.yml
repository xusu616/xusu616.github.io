name: Sync from CNBlogs

on:  
#  schedule:  
#    - cron: '0 18 * * *'  # 每天凌晨 2 点（UTC 18:00）
  workflow_dispatch:  
    inputs:  
      ref: 
        description: 'Branch to sync/build'
        required: false
        default: 'main'

permissions:  
  contents: write

jobs:  
  sync:  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}  # 改用 PAT
          fetch-depth: 0
          persist-credentials: true
          submodules: recursive
          ref: ${{ github.event.inputs.ref || 'main' }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Hexo
        run: npm install -g hexo-cli

      - name: Install dependencies
        run: npm install

      - name: Sync full articles from CNBlogs
        run: node scripts/sync-cnblogs-full.js

      - name:  Commit and push
        env:
          GIT_AUTHOR_NAME: "GitHub Actions"
          GIT_AUTHOR_EMAIL: "actions@github.com"
          GIT_COMMITTER_NAME: "GitHub Actions"
          GIT_COMMITTER_EMAIL: "actions@github.com"
        run: |
          git config pull.rebase false
          git pull origin main --no-edit || true
          
          git add source/_posts
          
          if git diff --quiet --cached; then
            echo "No changes to commit."
          else
            git commit -m "Auto sync from CNBlogs"
            git push origin HEAD:main
          fi
