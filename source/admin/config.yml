backend:
  name: github
  repo: rD227/rD227.github.io
  branch: main
  base_url: https://YOUR_OAUTH_SITE.netlify.app  # 改成你的 Netlify OAuth 站点地址
  site_domain: https://rD227.github.io

media_folder: "source/img"
public_folder: "/img"

locale: 'zh_Hans'

collections:
  - name: "post"
    label: "博客文章"
    folder: "source/_posts"
    create: true
    slug: "{{slug}}"
    editor:
      preview: false
    fields:
      - { label: "标题", name: "title", widget: "string" }
      - { label: "发布日期", name: "date", widget: "datetime", format: "YYYY-MM-DD HH:mm:ss" }
      - { label: "标签", name: "tags", widget: "list", required: false }
      - { label: "分类", name: "categories", widget: "list", required: false }
      - { label: "摘要", name: "excerpt", widget: "text", required: false }
      - { label: "正文", name: "body", widget: "markdown" }
