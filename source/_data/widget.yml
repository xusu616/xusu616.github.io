      </div>
      <script>
      (function () {
        var schedule = [
          [6, 'waking'], [8, 'alert'], [10, 'playing'], [12, 'napping'],
          [15, 'grooming'], [17, 'waiting'], [18, 'eating'], [20, 'winding'],
          [21, 'asleep']
        ];
        function currentState() {
          var h = new Date().getHours();
          var state = 'asleep';
          for (var i = 0; i < schedule.length; i++) {
            if (h >= schedule[i][0]) state = schedule[i][1];
          }
          return state;
        }
        function applyState() {
          var states = document.querySelectorAll('.pixel-cat .pixel-cat-state');
          var active = currentState();
          for (var i = 0; i < states.length; i++) {
            if (states[i].getAttribute('data-state') === active) {
              states[i].classList.add('active');
            } else {
              states[i].classList.remove('active');
            }
          }
        }
        function init() {
          var wrap = document.querySelector('.pixel-cat');
          if (!wrap || wrap.getAttribute('data-pixel-cat-ready')) return;
          wrap.setAttribute('data-pixel-cat-ready', '1');
          applyState();
          setInterval(applyState, 60000);
        }
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init);
        } else {
          init();
        }
      })();
      </script>
